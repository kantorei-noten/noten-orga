name: Release

# Baut bei einem Tag v* die drei Images für amd64 und arm64 (Server, NAS, Raspberry Pi)
# und veröffentlicht sie auf der GitHub Container Registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # GitHub-Release anlegen
  packages: write   # nach ghcr.io pushen

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/Dockerfile
          - name: worker
            dockerfile: docker/Dockerfile.worker
          - name: web
            dockerfile: docker/Dockerfile.caddy
          - name: backup
            dockerfile: docker/Dockerfile.backup
    steps:
      - uses: actions/checkout@v7

      # arm64 wird per Emulation gebaut (NAS/Raspberry Pi)
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # AGPL §13: der Footer der PWA verlinkt auf genau dieses Repository
          build-args: |
            VITE_QUELLCODE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  scan:
    needs: images
    if: startsWith(github.ref, 'refs/tags/')   # nur Tags tragen den hier geprüften Namen
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [app, worker, web, backup]
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # meldet, blockiert die Veröffentlichung aber nicht

  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          {
            echo "## Installation"
            echo
            echo '```bash'
            echo "git clone $SERVER_URL/$REPO && cd noten-orga/docker"
            echo "./setup.sh"
            echo "NOTEN_VERSION=$TAG docker compose up -d"
            echo "docker compose exec app python -m app.cli create-admin <benutzername>"
            echo '```'
            echo
            echo "Images: \`ghcr.io/$REPO/{app,worker,web,backup}:$TAG\` (amd64 + arm64)"
            echo
            if [ -f CHANGELOG.md ]; then
              echo "## Änderungen"
              echo
              awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2
            fi
          } > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
